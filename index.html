<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>霓虹星際躲避戰 | My First Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.25);
      border: 2px solid #00f3ff;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: radial-gradient(circle at center, #161b29 0%, #090c10 100%);
    }
    #ui-layer {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
    }
    #status-bar {
      position: absolute;
      top: 42px;
      left: 20px;
      display: flex;
      gap: 8px;
      pointer-events: none;
      font-size: 12px;
      font-weight: bold;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid currentColor;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 14, 20, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 26px;
      color: #00f3ff;
      margin-bottom: 8px;
      text-shadow: 0 0 15px #00f3ff;
    }
    p {
      font-size: 14px;
      color: #b0c4de;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    #nameInput {
      width: 210px;
      padding: 10px 14px;
      margin-bottom: 16px;
      border-radius: 20px;
      border: 2px solid #00f3ff;
      background: #121722;
      color: #ffffff;
      font-size: 15px;
      text-align: center;
      outline: none;
    }
    #nameInput::placeholder {
      color: #6c7a96;
    }
    button {
      background: #00f3ff;
      color: #0b0e14;
      border: none;
      padding: 11px 30px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
      transition: transform 0.15s, background 0.15s;
    }
    button:hover {
      background: #ffffff;
      transform: scale(1.05);
    }
    #leaderboard {
      width: 240px;
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: left;
    }
    #leaderboard h3 {
      font-size: 14px;
      color: #ffd700;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    #leaderboard ol {
      list-style: none;
      font-size: 13px;
      color: #e0e6ed;
    }
    #leaderboard li {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }
    #leaderboard li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="360" height="600"></canvas>
    <div id="ui-layer">
      <span>玩家: <span id="displayPlayerName">玩家1</span></span>
      <span>分數: <span id="score">0</span></span>
    </div>
    <div id="status-bar">
      <span id="shieldBadge" class="badge" style="color: #00f3ff; display: none;">🛡️ 護盾啟動</span>
      <span id="magnetBadge" class="badge" style="color: #d946ef; display: none;">🧲 磁鐵吸金</span>
      <span id="slowBadge" class="badge" style="color: #22c55e; display: none;">⏳ 時間緩速</span>
    </div>
    <div id="overlay">
      <h1 id="title">霓虹星際躲避戰</h1>
      <p id="desc">左右移動躲避紅球、吃金球<br>收集隨機道具獲得護盾、磁鐵與緩速！</p>
      <input type="text" id="nameInput" maxlength="10" placeholder="請輸入你的玩家名稱">
      <button id="startBtn">開始遊戲</button>
      <div id="leaderboard">
        <h3>🏆 榮譽排行榜 (TOP 5)</h3>
        <ol id="rankList"></ol>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const displayPlayerNameEl = document.getElementById('displayPlayerName');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const nameInput = document.getElementById('nameInput');
    const startBtn = document.getElementById('startBtn');
    const rankListEl = document.getElementById('rankList');

    const shieldBadge = document.getElementById('shieldBadge');
    const magnetBadge = document.getElementById('magnetBadge');
    const slowBadge = document.getElementById('slowBadge');

    let isPlaying = false;
    let score = 0;
    let currentPlayerName = localStorage.getItem('neonPlayerName') || '';
    nameInput.value = currentPlayerName;

    // 讀取排行榜
    let leaderboard = JSON.parse(localStorage.getItem('neonLeaderboard')) || [];
    function renderLeaderboard() {
      if (leaderboard.length === 0) {
        rankListEl.innerHTML = '<li style="justify-content:center; color:#8892b0;">目前尚無紀錄，快來搶第一！</li>';
        return;
      }
      rankListEl.innerHTML = leaderboard.map((item, idx) => `
        <li>
          <span>#${idx + 1} ${item.name}</span>
          <span style="color:#00f3ff; font-weight:bold;">${item.score} 分</span>
        </li>
      `).join('');
    }
    renderLeaderboard();

    const player = { x: 180, y: 520, radius: 14, speed: 6 };
    let enemies = [];
    let coins = [];
    let powerups = [];
    let particles = [];
    let keys = { left: false, right: false };

    // 道具狀態
    let hasShield = false;
    let magnetTimer = 0;
    let slowTimer = 0;

    // 鍵盤控制
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    // 觸控與滑鼠拖曳控制
    function movePlayerTo(clientX) {
      const rect = canvas.getBoundingClientRect();
      const targetX = clientX - rect.left;
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, targetX));
    }
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (isPlaying) movePlayerTo(e.touches[0].clientX);
    }, { passive: false });
    canvas.addEventListener('mousemove', e => {
      if (isPlaying && e.buttons === 1) movePlayerTo(e.clientX);
    });

    function createParticles(x, y, color) {
      for (let i = 0; i < 14; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          color
        });
      }
    }

    function updateStatusBadges() {
      shieldBadge.style.display = hasShield ? 'inline-block' : 'none';
      magnetBadge.style.display = magnetTimer > 0 ? 'inline-block' : 'none';
      slowBadge.style.display = slowTimer > 0 ? 'inline-block' : 'none';
    }

    function resetGame() {
      const inputVal = nameInput.value.trim();
      currentPlayerName = inputVal || '無名英雄';
      localStorage.setItem('neonPlayerName', currentPlayerName);
      displayPlayerNameEl.textContent = currentPlayerName;

      score = 0;
      scoreEl.textContent = score;
      player.x = canvas.width / 2;
      enemies = [];
      coins = [];
      powerups = [];
      particles = [];
      hasShield = false;
      magnetTimer = 0;
      slowTimer = 0;
      updateStatusBadges();

      isPlaying = true;
      overlay.style.display = 'none';
      requestAnimationFrame(gameLoop);
    }

    function saveScoreToLeaderboard(name, finalScore) {
      leaderboard.push({ name, score: finalScore });
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 5);
      localStorage.setItem('neonLeaderboard', JSON.stringify(leaderboard));
      renderLeaderboard();
    }

    function gameOver() {
      isPlaying = false;
      createParticles(player.x, player.y, '#00f3ff');
      saveScoreToLeaderboard(currentPlayerName, score);

      titleEl.textContent = '遊戲結束！';
      descEl.innerHTML = `<strong>${currentPlayerName}</strong> 本次得分：<strong>${score}</strong>`;
      startBtn.textContent = '再玩一次';
      overlay.style.display = 'flex';
    }

    function gameLoop() {
      if (!isPlaying) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 倒數道具時間
      if (magnetTimer > 0) magnetTimer--;
      if (slowTimer > 0) slowTimer--;
      updateStatusBadges();

      // 玩家移動
      if (keys.left) player.x -= player.speed;
      if (keys.right) player.x += player.speed;
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));

      // 繪製護盾外圈
      if (hasShield) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 7, 0, Math.PI * 2);
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      // 繪製玩家
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#00f3ff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00f3ff';
      ctx.fill();
      ctx.shadowBlur = 0;

      // 生成敵人 (維持少且慢的設定)
      const spawnRate = Math.min(0.04, 0.012 + score * 0.0002);
      if (Math.random() < spawnRate) {
        enemies.push({
          x: Math.random() * (canvas.width - 30) + 15,
          y: -20,
          radius: 12 + Math.random() * 10,
          speed: 1.8 + Math.random() * 1.2 + score * 0.015
        });
      }

      // 生成金幣能量球
      if (Math.random() < 0.022) {
        coins.push({
          x: Math.random() * (canvas.width - 20) + 10,
          y: -15,
          radius: 9,
          speed: 3.0
        });
      }

      // 生成隨機道具 (機率約每幾秒一顆)
      if (Math.random() < 0.0045) {
        const types = [
          { type: 'shield', color: '#00f3ff', label: '盾' },
          { type: 'magnet', color: '#d946ef', label: '磁' },
          { type: 'slow',   color: '#22c55e', label: '慢' }
        ];
        const chosen = types[Math.floor(Math.random() * types.length)];
        powerups.push({
          x: Math.random() * (canvas.width - 30) + 15,
          y: -20,
          radius: 13,
          speed: 2.5,
          ...chosen
        });
      }

      // 更新與繪製敵人
      const speedMultiplier = slowTimer > 0 ? 0.45 : 1;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed * speedMultiplier;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2a5f';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff2a5f';
        ctx.fill();
        ctx.shadowBlur = 0;

        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.radius + e.radius - 3) {
          if (hasShield) {
            // 消耗護盾抵擋一次撞擊
            hasShield = false;
            updateStatusBadges();
            createParticles(e.x, e.y, '#00f3ff');
            enemies.splice(i, 1);
            continue;
          } else {
            gameOver();
            return;
          }
        }
        if (e.y > canvas.height + 30) {
          enemies.splice(i, 1);
          score += 1;
          scoreEl.textContent = score;
        }
      }

      // 更新與繪製金幣能量球
      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        // 磁鐵效果：自動吸向玩家
        if (magnetTimer > 0) {
          const dx = player.x - c.x;
          const dy = player.y - c.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 220) {
            c.x += (dx / dist) * 6;
            c.y += (dy / dist) * 6;
          } else {
            c.y += c.speed;
          }
        } else {
          c.y += c.speed;
        }

        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd700';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffd700';
        ctx.fill();
        ctx.shadowBlur = 0;

        const dist = Math.hypot(player.x - c.x, player.y - c.y);
        if (dist < player.radius + c.radius) {
          createParticles(c.x, c.y, '#ffd700');
          coins.splice(i, 1);
          score += 10;
          scoreEl.textContent = score;
        } else if (c.y > canvas.height + 20) {
          coins.splice(i, 1);
        }
      }

      // 更新與繪製隨機道具
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.speed;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 14;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.shadowBlur = 0;

        // 繪製道具文字
        ctx.fillStyle = '#0b0e14';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.label, p.x, p.y);

        const dist = Math.hypot(player.x - p.x, player.y - p.y);
        if (dist < player.radius + p.radius) {
          createParticles(p.x, p.y, p.color);
          if (p.type === 'shield') hasShield = true;
          if (p.type === 'magnet') magnetTimer = 360; // 約 6 秒
          if (p.type === 'slow') slowTimer = 300;     // 約 5 秒
          updateStatusBadges();
          powerups.splice(i, 1);
        } else if (p.y > canvas.height + 25) {
          powerups.splice(i, 1);
        }
      }

      // 粒子特效
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.globalAlpha = pt.life;
          ctx.fillStyle = pt.color;
          ctx.fillRect(pt.x, pt.y, 4, 4);
          ctx.globalAlpha = 1;
        }
      }

      requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', resetGame);
  </script>
</body>
</html>
